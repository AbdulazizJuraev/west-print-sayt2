<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — West Print</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('wp_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="gallery.html">
<link rel="prefetch" href="contact.html">
</head>
<body data-page="gallery">

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="West Print" class="brand-logo">
    </a>
  </div>
</header>

<nav class="bottom-nav" id="bottomNav">
  <a href="index.html" class="bottom-nav-item" data-page="index">
    <span data-icon="home"></span>
    <span data-i18n="nav_home">Bosh sahifa</span>
  </a>
  <a href="services.html" class="bottom-nav-item" data-page="services">
    <span data-icon="printer"></span>
    <span data-i18n="nav_services">Xizmatlar</span>
  </a>
  <a href="gallery.html" class="bottom-nav-item" data-page="gallery">
    <span data-icon="image"></span>
    <span data-i18n="nav_gallery">Ishlarimiz</span>
  </a>
  <a href="contact.html" class="bottom-nav-item" data-page="contact">
    <span data-icon="phone"></span>
    <span data-i18n="nav_contact">Aloqa</span>
  </a>
  <div class="nav-settings">
    <button type="button" class="bottom-nav-item settings-toggle" id="settingsToggle">
      <span data-icon="settings"></span>
      <span data-i18n="nav_settings">Sozlamalar</span>
    </button>
    <div class="settings-dropdown" id="settingsDropdown">
      <div class="settings-row">
        <span data-i18n="settings_theme">Mavzu</span>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Mavzuni almashtirish" title="Mavzuni almashtirish"></button>
      </div>
      <div class="settings-row">
        <span data-i18n="settings_language">Til</span>
        <div class="lang-switch" id="langSwitch">
          <button type="button" data-lang-btn="uz">UZ</button>
          <button type="button" data-lang-btn="ru">RU</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main>

  <section class="gallery">
    <div class="container">
      <a class="back-link" href="gallery.html">
        <span data-i18n="portfolio_back">← Ishlarimizga qaytish</span>
      </a>
      <h2 data-i18n="portfolio_title">Portfolio</h2>
      <p class="section-subtitle" data-i18n="portfolio_subtitle">Bajarilgan ishlarimiz to'plami</p>
      <div class="gallery-grid" id="portfolioGrid"></div>
    </div>
  </section>

</main>

<div class="modal-backdrop" id="lightbox" hidden>
  <div class="lightbox-panel">
    <button type="button" class="modal-close" id="lightboxClose" aria-label="Yopish">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"></path></svg>
    </button>
    <img id="lightboxImage" alt="">
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <span>West Print &copy; <span id="year"></span> — <span data-i18n="footer_rights">Barcha huquqlar himoyalangan.</span></span>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/catalog.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/theme.js"></script>
<script src="js/main.js"></script>
</body>
</html>
