<main>

  <section class="why-us" id="why-us">
    <div class="container">
      <span class="section-eyebrow" data-i18n="why_eyebrow">Afzalliklarimiz</span>
      <h2 data-i18n="why_title">Nega aynan West Print?</h2>
      <p class="section-subtitle" data-i18n="why_subtitle">Kartochkani bosing — batafsil o'qing</p>
      <div class="why-grid">
      <button type="button" class="why-card" aria-haspopup="dialog"
              data-image="https://images.unsplash.com/photo-1503694978374-8a2fa686963a?w=600&q=75&auto=format&fit=crop">
        <span class="why-icon" data-icon="lightning"></span>
        <span class="why-card-title" data-i18n="why_fast_title">Tezkor bajarish</span>
        <span class="why-card-text" data-i18n="why_fast_text">Buyurtmalar qisqa muddatda tayyor bo'ladi</span>
        <span class="why-detail-text" data-i18n="why_fast_detail">Buyurtmangiz kelishilgandan so'ng darhol ishlab chiqarishga o'tadi. Aniq muddat mahsulot turi va tirajga qarab oldindan belgilanadi va o'sha muddatda topshiriladi.</span>
      </button>
      <button type="button" class="why-card" aria-haspopup="dialog"
              data-image="https://images.unsplash.com/photo-1581079289196-67865ea83118?w=600&q=75&auto=format&fit=crop">
        <span class="why-icon" data-icon="target"></span>
        <span class="why-card-title" data-i18n="why_quality_title">Yuqori sifat</span>
        <span class="why-card-text" data-i18n="why_quality_text">Zamonaviy uskunalar va sifatli materiallar</span>
        <span class="why-detail-text" data-i18n="why_quality_detail">Zamonaviy uskunalarda, sifatli qog'oz va bo'yoqlar bilan chop etamiz. Ranglar aniqligi va bosma sifati butun tiraj bo'ylab bir xil bo'lishiga alohida e'tibor beriladi.</span>
      </button>
      <button type="button" class="why-card" aria-haspopup="dialog"
              data-image="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=600&q=75&auto=format&fit=crop">
        <span class="why-icon" data-icon="shieldCheck"></span>
        <span class="why-card-title" data-i18n="why_price_title">Aniq narx va muddat</span>
        <span class="why-card-text" data-i18n="why_price_text">Narx va muddat oldindan aniq kelishiladi, yashirin to'lovlarsiz</span>
        <span class="why-detail-text" data-i18n="why_price_detail">Narx va muddat ish boshlanishidan oldin aniq aytiladi. Kelishilgan summadan tashqari yashirin to'lovlar yo'q — biror o'zgarish bo'lsa, albatta oldindan xabar beramiz.</span>
      </button>
      <button type="button" class="why-card" aria-haspopup="dialog"
              data-image="https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?w=600&q=75&auto=format&fit=crop">
        <span class="why-icon" data-icon="palette"></span>
        <span class="why-card-title" data-i18n="why_design_title">Professional dizayn</span>
        <span class="why-card-text" data-i18n="why_design_text">Kerak bo'lsa dizayn bo'yicha ham yordam beramiz</span>
        <span class="why-detail-text" data-i18n="why_design_detail">Tayyor maketingiz bo'lmasa, dizaynerlarimiz uni tayyorlab beradi. Tayyor faylingizni ham chop etishdan oldin tekshirib, bosmaga moslab beramiz.</span>
      </button>
