name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp every local css/js URL with the commit SHA so browsers can
      # never mix a cached old stylesheet with freshly deployed HTML.
      # Only relative css/ and js/ paths match — external URLs are left alone.
      - name: Cache-bust asset URLs
        run: |
          sha="${GITHUB_SHA::8}"
          find public -name '*.html' -print0 | xargs -0 sed -i \
            -e "s|\(href=\"css/[^\"?]*\.css\)\"|\1?v=$sha\"|g" \
            -e "s|\(src=\"js/[^\"?]*\.js\)\"|\1?v=$sha\"|g"
          grep -h -o -E 'href="css/[^"]*"|src="js/[^"]*"' public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
